name: Pruebas

# Pasa las pruebas de Pester en cada cambio, con Windows PowerShell 5.1 y Pester 3.4,
# las mismas versiones con las que se escriben en local.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pester 3.4
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq '3.4.0')) {
            Install-Module Pester -RequiredVersion 3.4.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }

      - name: Pasar las pruebas
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          $r = Invoke-Pester .\tests -PassThru
          if ($r.FailedCount -gt 0) { throw "Fallaron $($r.FailedCount) pruebas." }
